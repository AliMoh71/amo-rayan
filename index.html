<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9F1D24">

    <title>عمو ريان | معجنات - صاج - سناك</title>

    <meta name="description"
          content="تصفح قائمة الأسعار والعروض وجديدنا من عمو ريان - معجنات، صاج وسناك">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div class="logo-container">
            <img src="images/logo.jpeg"
                 alt="شعار عمو ريان"
                 class="logo">
        </div>

    </header>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main>

        <!-- =================================
             1. PRICES - قائمة الأسعار
        ================================== -->

        <section class="prices-section" id="prices">

            <h2>قائمة الأسعار</h2>

            <p class="prices-description">
                اضغط على الصورة لتكبيرها
            </p>

            <div class="prices-gallery">

                <!-- First price image -->
                <img src="images/main_prices/main_prices.jpeg"
                     alt="قائمة الأسعار - الصفحة الأولى"
                     class="price-thumbnail"
                     onclick="openGallery(0)"
                     tabindex="0"
                     role="button"
                     onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openGallery(0); }">

                <!-- Second price image -->
                <img src="images/main_prices/prices2.jpeg"
                     alt="قائمة الأسعار - الصفحة الثانية"
                     class="price-thumbnail"
                     onclick="openGallery(1)"
                     tabindex="0"
                     role="button"
                     onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openGallery(1); }">

            </div>

        </section>


        <!-- =================================
             2. OFFERS - عروضنا
        ================================== -->

        <section class="offers-section" id="offers">

            <h2>🔥 عروضنا</h2>

            <div class="offers-wrapper">

                <!-- Previous offer - RIGHT -->
                <button class="slider-btn prev-btn"
                        type="button"
                        dir="ltr"
                        aria-label="العرض السابق">
                    &#10095;
                </button>

                <!-- Offers generated by JavaScript -->
                <div class="offers-slider"
                     id="offersSlider"
                     aria-label="صور العروض">
                </div>

                <!-- Next offer - LEFT -->
                <button class="slider-btn next-btn"
                        type="button"
                        dir="ltr"
                        aria-label="العرض التالي">
                    &#10094;
                </button>

            </div>

            <!-- Offers navigation dots -->
            <div class="slider-dots"
                 id="sliderDots">
            </div>

        </section>


        <!-- =================================
             3. NEW PRODUCTS - جديدنا
        ================================== -->

        <section class="new-section" id="new">

            <h2>✨ جديدنا</h2>

            <div class="new-wrapper">

                <!-- Previous image - RIGHT -->
                <button class="new-btn new-prev-btn"
                        type="button"
                        dir="ltr"
                        aria-label="الصورة السابقة">
                    &#10095;
                </button>

                <!-- New product images generated by JavaScript -->
                <div class="new-slider"
                     id="newSlider"
                     aria-label="صور جديدنا">
                </div>

                <!-- Next image - LEFT -->
                <button class="new-btn new-next-btn"
                        type="button"
                        dir="ltr"
                        aria-label="الصورة التالية">
                    &#10094;
                </button>

            </div>

            <!-- New products navigation dots -->
            <div class="new-dots"
                 id="newDots">
            </div>

        </section>

    </main>


    <!-- =====================================
         FULLSCREEN GALLERY

         Used for:
         - Prices
         - Offers
         - New products
    ====================================== -->

    <div class="gallery-modal"
         id="galleryModal"
         role="dialog"
         aria-modal="true"
         aria-label="معرض الصور"
         hidden>

        <!-- Close gallery -->
        <button class="gallery-close"
                type="button"
                onclick="closeGallery()"
                aria-label="إغلاق المعرض">
            &times;
        </button>

        <!-- Previous image - RIGHT -->
        <button class="gallery-prev"
                type="button"
                dir="ltr"
                onclick="changeImage(-1)"
                aria-label="الصورة السابقة">
            &#10095;
        </button>

        <!-- Fullscreen image -->
        <img id="galleryImage"
             src="images/main_prices/main_prices.jpeg"
             alt="الصورة المكبرة"
             draggable="false">

        <!-- Next image - LEFT -->
        <button class="gallery-next"
                type="button"
                dir="ltr"
                onclick="changeImage(1)"
                aria-label="الصورة التالية">
            &#10094;
        </button>

        <!-- Image counter -->
        <p class="gallery-counter"
           id="galleryCounter"
           dir="ltr">
            1 / 2
        </p>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="footer">

        <div class="footer-logo-container">
            <img src="images/logo.jpeg"
                 alt="شعار عمو ريان"
                 class="footer-logo">
        </div>

        <h3>عمو ريان</h3>

        <p>معجنات - صاج - سناك</p>

        <!-- WhatsApp Contact Button -->
        <a href="https://wa.me/96176062024"
           class="whatsapp-btn"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="تواصل معنا عبر واتساب">

            <!-- WhatsApp Logo -->
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="28"
                 height="28"
                 fill="currentColor"
                 aria-hidden="true">

                <path d="M20.52 3.48A11.88 11.88 0 0 0 12.05 0C5.48 0 .13 5.35.12 11.93c0 2.1.55 4.15 1.6 5.96L0 24l6.28-1.65a11.94 11.94 0 0 0 5.76 1.47h.01c6.57 0 11.92-5.35 11.95-11.93a11.86 11.86 0 0 0-3.48-8.41ZM12.05 21.8a9.91 9.91 0 0 1-5.05-1.38l-.36-.21-3.73.98.99-3.63-.24-.37a9.91 9.91 0 0 1-1.52-5.26c0-5.47 4.45-9.92 9.93-9.92a9.85 9.85 0 0 1 7.01 2.91 9.84 9.84 0 0 1 2.9 7.02c-.02 5.47-4.47 9.91-9.93 9.91Zm5.44-7.43c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.48-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.11 3.22 5.11 4.51.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/>

            </svg>

            <span>تواصل معنا عبر واتساب</span>

        </a>

    </footer>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>
</html>
